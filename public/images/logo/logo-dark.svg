<svg width="160" height="32" viewBox="0 0 160 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon: rounded square with Android robot -->
  <rect width="32" height="32" rx="8" fill="#465FFF"/>
  <!-- Android body -->
  <rect x="9" y="15" width="14" height="10" rx="2" fill="white"/>
  <!-- Android head -->
  <ellipse cx="16" cy="12" rx="6" ry="5" fill="white"/>
  <!-- Eyes -->
  <circle cx="13.5" cy="11.5" r="1" fill="#465FFF"/>
  <circle cx="18.5" cy="11.5" r="1" fill="#465FFF"/>
  <!-- Antennas -->
  <line x1="13" y1="7.5" x2="11" y2="5.5" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="19" y1="7.5" x2="21" y2="5.5" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Left arm -->
  <rect x="6" y="15" width="3" height="7" rx="1.5" fill="white"/>
  <!-- Right arm -->
  <rect x="23" y="15" width="3" height="7" rx="1.5" fill="white"/>
  <!-- Left leg -->
  <rect x="10.5" y="24" width="3" height="4" rx="1.5" fill="white"/>
  <!-- Right leg -->
  <rect x="18.5" y="24" width="3" height="4" rx="1.5" fill="white"/>

  <!-- Wordmark dark mode: white text -->
  <text x="40" y="22" font-family="Outfit, sans-serif" font-size="16" font-weight="700" fill="white" letter-spacing="-0.3">Device</text>
  <text x="95" y="22" font-family="Outfit, sans-serif" font-size="16" font-weight="400" fill="#9CB9FF" letter-spacing="-0.3">Monitor</text>
</svg>
